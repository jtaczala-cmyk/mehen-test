:root{
  --bg:#000; --panel:#0a0805; --panel2:#120e07; --line:#2e2412; --line2:#4a3a18; --txt:#f3e7c8; --mut:#a3936f;
  --gold:#f2c14e; --gold2:#ffe39a; --gold3:#b8862b; --p0:#ffb53a; --p1:#2fd8e8; --lapis:#2a5bd7; --red:#ff4d6a; --green:#4ff0a0;
  --disp:"Cinzel",Georgia,"Times New Roman",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior:none}
body{overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:relative;margin:0 auto;max-width:540px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:calc(4px + var(--sat)) calc(10px + var(--sar)) calc(4px + var(--sab)) calc(10px + var(--sal));overflow:hidden;
  background:radial-gradient(120% 60% at 50% 48%,#140d03 0%,#050301 55%,#000 80%)}
@media (min-width:700px){#app{border-left:1px solid #1a1409;border-right:1px solid #1a1409;box-shadow:0 0 120px #f2c14e12}}
/* header */
#top{display:flex;align-items:center;gap:6px;min-height:46px}
.logo{width:34px;height:34px;border-radius:9px;box-shadow:0 0 0 1px #f2c14e40,0 0 14px #f2c14e30;flex:0 0 auto}
.brand{flex:1;min-width:0;line-height:1;display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-left:2px}
.brand b{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:3px;white-space:nowrap;
  background:linear-gradient(180deg,#fff4c6 0%,#f2c14e 45%,#a8741c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px #f2c14e55)}
.brand small{font-family:var(--disp);font-weight:600;font-size:9.5px;color:var(--mut);letter-spacing:2.2px;text-transform:uppercase;white-space:nowrap}
.testbadge{font-size:8.5px;font-weight:800;letter-spacing:1.2px;color:#1a1000;background:linear-gradient(180deg,#ffe39a,#f2c14e);padding:3px 6px;border-radius:5px;white-space:nowrap;box-shadow:0 0 10px #f2c14e55}
.ibtn{width:36px;height:36px;border-radius:11px;background:linear-gradient(180deg,#15100a,#0a0805);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold2);font-family:var(--disp);font-weight:800;font-size:12.5px;letter-spacing:.5px;flex:0 0 auto}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.93)}
/* players */
#players{display:flex;gap:8px;margin:5px 0 2px}
.pl{flex:1;min-width:0;border-radius:16px;padding:6px 8px 7px;display:flex;gap:7px;align-items:center;position:relative;
  background:linear-gradient(180deg,#120d06,#070503);border:1px solid var(--line);transition:box-shadow .35s,border-color .35s,opacity .35s,transform .35s;opacity:.6}
.pl.on{opacity:1}
.pl[data-p="0"].on{border-color:#ffb53a99;box-shadow:0 0 18px #ffb53a40,inset 0 0 18px #ffb53a1a}
.pl[data-p="1"].on{border-color:#2fd8e899;box-shadow:0 0 18px #2fd8e840,inset 0 0 18px #2fd8e81a}
.pl.on::before{content:"";position:absolute;left:50%;top:-1px;width:40%;height:2px;transform:translateX(-50%);border-radius:2px;background:currentColor;box-shadow:0 0 10px currentColor}
.pl[data-p="0"]{color:var(--p0)} .pl[data-p="1"]{color:var(--p1)}
.av{width:38px;height:38px;flex:0 0 auto}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pl .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.pl .tray{display:flex;align-items:center;gap:2px;min-height:22px}
.tok{width:22px;height:22px;border-radius:50%;position:relative;flex:0 0 auto;touch-action:none;display:grid;place-items:center}
.tok img{width:22px;height:22px;pointer-events:none;display:block}
.tok.gone img{opacity:.22;filter:grayscale(.6)}
.tok.can{animation:glow 1s ease-in-out infinite;cursor:pointer}
.tok.done::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--gold);box-shadow:0 0 6px var(--gold)}
.pl .lbl2{font-size:9.5px;line-height:1.2;color:var(--mut);margin-left:auto;white-space:nowrap;text-align:right}
.prog{height:3px;border-radius:3px;background:#ffffff12;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,currentColor,#fff8);transition:width .5s}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 1px #fff8)}50%{filter:drop-shadow(0 0 7px #fff)}}
/* board */
#boardWrap{position:relative;flex:1 1 0;min-height:0;overflow:hidden;display:grid;place-items:center}
#board{display:block;position:relative;touch-action:none;cursor:pointer}
#stage{position:relative;line-height:0}
.lay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#ringL{animation:ringspin 120s linear infinite;will-change:transform}
@keyframes ringspin{to{transform:rotate(360deg)}}
#sunL{position:absolute;pointer-events:none;animation:sunpulse 3.27s ease-in-out infinite alternate;will-change:transform,opacity}
@keyframes sunpulse{from{opacity:.35;transform:scale(1)}to{opacity:.62;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){#ringL,#sunL{animation:none}}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:2px;font-size:11.5px;color:var(--gold2);background:#000d;border:1px solid var(--line2);padding:4px 11px;border-radius:999px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s}
#hint.show{opacity:1}
#throwFx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(94%,360px);aspect-ratio:2.1;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;border-radius:22px;
  background:radial-gradient(120% 120% at 50% 40%,#1d1407ee 0%,#0b0703f2 60%,#050302f5 100%);border:1px solid #f2c14e55;box-shadow:0 10px 40px #000c,0 0 30px #f2c14e22,inset 0 0 30px #000}
#throwFx::before{content:"";position:absolute;inset:6px;border-radius:17px;border:1px dashed #f2c14e2a;pointer-events:none}
#throwFx.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#throwFx canvas{width:100%;height:100%;display:block}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.85);padding:12px 24px 13px;border-radius:16px;background:linear-gradient(180deg,#1a1207f2,#070402f2);border:1px solid #f2c14e88;color:var(--gold2);
  font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:1px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 0 34px #f2c14e33,0 10px 30px #000;white-space:nowrap}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner small{display:block;font-family:-apple-system,system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:0;color:var(--mut);margin-top:3px}
/* action bar */
#bar{display:flex;align-items:center;gap:10px;padding:6px 2px 2px}
#status{flex:1;min-width:0;font-size:13px;line-height:1.3;color:var(--txt);min-height:34px}
#status b{color:var(--gold2);font-weight:700}
#rollBtn{flex:0 0 auto;min-width:118px;height:54px;border-radius:17px;font-family:var(--disp);font-size:19px;font-weight:800;letter-spacing:2px;color:#2a1700;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#fff0b5 0%,#f2c14e 45%,#c08a22 80%,#8a5c10 100%);box-shadow:0 0 22px #f2c14e55,inset 0 1px 0 #fff8,inset 0 -3px 0 #6b4308;transition:filter .2s,transform .1s,box-shadow .2s}
#rollBtn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite}
#rollBtn:active{transform:scale(.95)}
#rollBtn:disabled{filter:grayscale(.9) brightness(.42);box-shadow:none}
#rollBtn:disabled::after{display:none}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
#foot{text-align:center;font-size:10px;letter-spacing:.5px;color:#6a5b3e;padding-top:3px}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:radial-gradient(90% 70% at 50% 45%,#0e0903f0,#000000f6);display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--sat)) 14px calc(12px + var(--sab));animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{position:relative;width:100%;max-width:440px;max-height:100%;overflow:auto;background:linear-gradient(180deg,#120d06 0%,#060402 100%);border:1px solid var(--line2);border-radius:24px;padding:18px 18px 16px;
  box-shadow:0 0 60px #f2c14e1c,inset 0 1px 0 #f2c14e22}
.card::before{content:"";position:absolute;inset:5px;border-radius:20px;border:1px solid #f2c14e18;pointer-events:none}
.card h2{margin:0 0 6px;font-family:var(--disp);font-weight:800;letter-spacing:2px;text-align:center;font-size:26px;
  background:linear-gradient(180deg,#fff4c6,#f2c14e 55%,#a8741c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px #f2c14e44)}
.card p,.card li{font-size:14px;line-height:1.5;color:var(--txt)}
.card ul{padding-left:4px;margin:6px 0;list-style:none}
.card li{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.card li .ic{flex:0 0 26px;height:26px;margin-top:-1px}
.card .sub{text-align:center;color:var(--mut);font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 14px;margin:8px 0 0;border-radius:15px;font-family:var(--disp);font-weight:800;font-size:15.5px;letter-spacing:.8px;
  background:linear-gradient(180deg,#19130a,#0c0905);border:1px solid var(--line2);color:var(--txt);text-align:center;box-shadow:inset 0 1px 0 #f2c14e1a}
.btn .bt{display:flex;flex-direction:column;align-items:center}
.btn.gold{background:linear-gradient(180deg,#fff0b5 0%,#f2c14e 45%,#c08a22 85%);color:#2a1700;border:0;box-shadow:0 0 20px #f2c14e44,inset 0 1px 0 #fff8,inset 0 -3px 0 #6b4308}
.btn small{display:block;font-family:-apple-system,system-ui,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:0;opacity:.72;margin-top:2px}
.btn img{width:26px;height:26px}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:8px}.row .btn{flex:1;flex-direction:column;gap:2px;padding:10px 6px}
/* menu hero */
#hero{position:relative;width:min(62vw,250px,30vh);aspect-ratio:1;margin:-4px auto 2px}
#hero::before{content:"";position:absolute;inset:-18%;border-radius:50%;background:repeating-conic-gradient(from 0deg,#f2c14e22 0deg 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(closest-side,#000 30%,transparent 100%);mask:radial-gradient(closest-side,#000 30%,transparent 100%);animation:spin 40s linear infinite}
#menuArt{position:relative;width:100%;height:100%;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.title{font-family:var(--disp);font-weight:800;font-size:38px;letter-spacing:8px;text-align:center;margin:0;line-height:1;padding-left:8px;
