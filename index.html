:root{
  --bg:#000; --panel:#0a0805; --panel2:#120e07; --line:#2e2412; --line2:#4a3a18; --txt:#f3e7c8; --mut:#a3936f;
  --gold:#f2c14e; --gold2:#ffe39a; --gold3:#b8862b; --p0:#ffb53a; --p1:#2fd8e8; --lapis:#2a5bd7; --red:#ff4d6a; --green:#4ff0a0;
  --disp:"Cinzel",Georgia,"Times New Roman",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior:none}
body{overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:relative;margin:0 auto;max-width:540px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:calc(4px + var(--sat)) calc(10px + var(--sar)) calc(4px + var(--sab)) calc(10px + var(--sal));overflow:hidden;
  background:radial-gradient(120% 60% at 50% 48%,#140d03 0%,#050301 55%,#000 80%)}
@media (min-width:700px){#app{border-left:1px solid #1a1409;border-right:1px solid #1a1409;box-shadow:0 0 120px #f2c14e12}}
/* header */
#top{display:flex;align-items:center;gap:6px;min-height:46px}
.logo{width:34px;height:34px;border-radius:9px;box-shadow:0 0 0 1px #f2c14e40,0 0 14px #f2c14e30;flex:0 0 auto}
.brand{flex:1;min-width:0;line-height:1;display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-left:2px}
.brand b{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:3px;white-space:nowrap;
  background:linear-gradient(180deg,#fff4c6 0%,#f2c14e 45%,#a8741c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px #f2c14e55)}
.brand small{font-family:var(--disp);font-weight:600;font-size:9.5px;color:var(--mut);letter-spacing:2.2px;text-transform:uppercase;white-space:nowrap}
.testbadge{font-size:8.5px;font-weight:800;letter-spacing:1.2px;color:#1a1000;background:linear-gradient(180deg,#ffe39a,#f2c14e);padding:3px 6px;border-radius:5px;white-space:nowrap;box-shadow:0 0 10px #f2c14e55}
.ibtn{width:36px;height:36px;border-radius:11px;background:linear-gradient(180deg,#15100a,#0a0805);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold2);font-family:var(--disp);font-weight:800;font-size:12.5px;letter-spacing:.5px;flex:0 0 auto}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.93)}
/* players */
#players{display:flex;gap:8px;margin:5px 0 2px}
.pl{flex:1;min-width:0;border-radius:16px;padding:6px 8px 7px;display:flex;gap:7px;align-items:center;position:relative;
  background:linear-gradient(180deg,#120d06,#070503);border:1px solid var(--line);transition:box-shadow .35s,border-color .35s,opacity .35s,transform .35s;opacity:.6}
.pl.on{opacity:1}
.pl[data-p="0"].on{border-color:#ffb53a99;box-shadow:0 0 18px #ffb53a40,inset 0 0 18px #ffb53a1a}
.pl[data-p="1"].on{border-color:#2fd8e899;box-shadow:0 0 18px #2fd8e840,inset 0 0 18px #2fd8e81a}
.pl.on::before{content:"";position:absolute;left:50%;top:-1px;width:40%;height:2px;transform:translateX(-50%);border-radius:2px;background:currentColor;box-shadow:0 0 10px currentColor}
.pl[data-p="0"]{color:var(--p0)} .pl[data-p="1"]{color:var(--p1)}
.av{width:38px;height:38px;flex:0 0 auto}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pl .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.pl .tray{display:flex;align-items:center;gap:2px;min-height:22px}
.tok{width:22px;height:22px;border-radius:50%;position:relative;flex:0 0 auto;touch-action:none;display:grid;place-items:center}
.tok img{width:22px;height:22px;pointer-events:none;display:block}
.tok.gone img{opacity:.22;filter:grayscale(.6)}
.tok.can{animation:glow 1s ease-in-out infinite;cursor:pointer}
.tok.done::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--gold);box-shadow:0 0 6px var(--gold)}
.pl .lbl2{font-size:9.5px;line-height:1.2;color:var(--mut);margin-left:auto;white-space:nowrap;text-align:right}
.prog{height:3px;border-radius:3px;background:#ffffff12;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,currentColor,#fff8);transition:width .5s}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 1px #fff8)}50%{filter:drop-shadow(0 0 7px #fff)}}
/* board */
#boardWrap{position:relative;flex:1 1 0;min-height:0;overflow:hidden;display:grid;place-items:center}
#board{display:block;position:relative;touch-action:none;cursor:pointer}
#stage{position:relative;line-height:0}
.lay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#ringL{animation:ringspin 120s linear infinite;will-change:transform}
@keyframes ringspin{to{transform:rotate(360deg)}}
#sunL{position:absolute;pointer-events:none;animation:sunpulse 3.27s ease-in-out infinite alternate;will-change:transform,opacity}
@keyframes sunpulse{from{opacity:.35;transform:scale(1)}to{opacity:.62;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){#ringL,#sunL{animation:none}}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:2px;font-size:11.5px;color:var(--gold2);background:#000d;border:1px solid var(--line2);padding:4px 11px;border-radius:999px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s}
#hint.show{opacity:1}
#throwFx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(94%,360px);aspect-ratio:2.1;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;border-radius:22px;
  background:radial-gradient(120% 120% at 50% 40%,#1d1407ee 0%,#0b0703f2 60%,#050302f5 100%);border:1px solid #f2c14e55;box-shadow:0 10px 40px #000c,0 0 30px #f2c14e22,inset 0 0 30px #000}
#throwFx::before{content:"";position:absolute;inset:6px;border-radius:17px;border:1px dashed #f2c14e2a;pointer-events:none}
#throwFx.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#throwFx canvas{width:100%;height:100%;display:block}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.85);padding:12px 24px 13px;border-radius:16px;background:linear-gradient(180deg,#1a1207f2,#070402f2);border:1px solid #f2c14e88;color:var(--gold2);
  font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:1px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 0 34px #f2c14e33,0 10px 30px #000;white-space:nowrap}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner small{display:block;font-family:-apple-system,system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:0;color:var(--mut);margin-top:3px}
/* action bar */
#bar{display:flex;align-items:center;gap:10px;padding:6px 2px 2px}
#status{flex:1;min-width:0;font-size:13px;line-height:1.3;color:var(--txt);min-height:34px}
#status b{color:var(--gold2);font-weight:700}
#rollBtn{flex:0 0 auto;min-width:118px;height:54px;border-radius:17px;font-family:var(--disp);font-size:19px;font-weight:800;letter-spacing:2px;color:#2a1700;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#fff0b5 0%,#f2c14e 45%,#c08a22 80%,#8a5c10 100%);box-shadow:0 0 22px #f2c14e55,inset 0 1px 0 #fff8,inset 0 -3px 0 #6b4308;transition:filter .2s,transform .1s,box-shadow .2s}
#rollBtn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite}
#rollBtn:active{transform:scale(.95)}
#rollBtn:disabled{filter:grayscale(.9) brightness(.42);box-shadow:none}
#rollBtn:disabled::after{display:none}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
#foot{text-align:center;font-size:10px;letter-spacing:.5px;color:#6a5b3e;padding-top:3px}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:radial-gradient(90% 70% at 50% 45%,#0e0903f0,#000000f6);display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--sat)) 14px calc(12px + var(--sab));animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{position:relative;width:100%;max-width:440px;max-height:100%;overflow:auto;background:linear-gradient(180deg,#120d06 0%,#060402 100%);border:1px solid var(--line2);border-radius:24px;padding:18px 18px 16px;
  box-shadow:0 0 60px #f2c14e1c,inset 0 1px 0 #f2c14e22}
.card::before{content:"";position:absolute;inset:5px;border-radius:20px;border:1px solid #f2c14e18;pointer-events:none}
.card h2{margin:0 0 6px;font-family:var(--disp);font-weight:800;letter-spacing:2px;text-align:center;font-size:26px;
  background:linear-gradient(180deg,#fff4c6,#f2c14e 55%,#a8741c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px #f2c14e44)}
.card p,.card li{font-size:14px;line-height:1.5;color:var(--txt)}
.card ul{padding-left:4px;margin:6px 0;list-style:none}
.card li{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.card li .ic{flex:0 0 26px;height:26px;margin-top:-1px}
.card .sub{text-align:center;color:var(--mut);font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 14px;margin:8px 0 0;border-radius:15px;font-family:var(--disp);font-weight:800;font-size:15.5px;letter-spacing:.8px;
  background:linear-gradient(180deg,#19130a,#0c0905);border:1px solid var(--line2);color:var(--txt);text-align:center;box-shadow:inset 0 1px 0 #f2c14e1a}
.btn .bt{display:flex;flex-direction:column;align-items:center}
.btn.gold{background:linear-gradient(180deg,#fff0b5 0%,#f2c14e 45%,#c08a22 85%);color:#2a1700;border:0;box-shadow:0 0 20px #f2c14e44,inset 0 1px 0 #fff8,inset 0 -3px 0 #6b4308}
.btn small{display:block;font-family:-apple-system,system-ui,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:0;opacity:.72;margin-top:2px}
.btn img{width:26px;height:26px}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:8px}.row .btn{flex:1;flex-direction:column;gap:2px;padding:10px 6px}
/* menu hero */
#hero{position:relative;width:min(62vw,250px,30vh);aspect-ratio:1;margin:-4px auto 2px}
#hero::before{content:"";position:absolute;inset:-18%;border-radius:50%;background:repeating-conic-gradient(from 0deg,#f2c14e22 0deg 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(closest-side,#000 30%,transparent 100%);mask:radial-gradient(closest-side,#000 30%,transparent 100%);animation:spin 40s linear infinite}
#menuArt{position:relative;width:100%;height:100%;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.title{font-family:var(--disp);font-weight:800;font-size:38px;letter-spacing:8px;text-align:center;margin:0;line-height:1;padding-left:8px;
  background:linear-gradient(180deg,#fff6d0 0%,#f2c14e 50%,#9c6a18 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #f2c14e55)}
.glyphs{display:flex;justify-content:center;gap:14px;margin:12px 0 0;opacity:.75}
.glyphs img{width:20px;height:20px}
/* mini */
#mini .card{text-align:center}
#miniCv{width:min(64vw,250px,34vh);height:min(64vw,250px,34vh);display:block;margin:4px auto;touch-action:none}
#miniTap{margin-top:6px;height:62px;font-size:21px;letter-spacing:3px}
#miniMsg{min-height:24px;font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:1px;color:var(--gold2)}
#miniTxt{font-size:13.5px!important;color:var(--mut)!important}
/* win */
#win .card{text-align:center;overflow:hidden}
#winRays{position:absolute;left:50%;top:92px;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,#f2c14e30 0deg 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(closest-side,#000 10%,transparent 75%);mask:radial-gradient(closest-side,#000 10%,transparent 75%);animation:spin 24s linear infinite}
#winCv{position:relative;width:200px;height:118px;display:block;margin:0 auto}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:21}
#winTitle{font-size:30px!important;position:relative}
#winTxt{position:relative}
.key{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid #5cf5a8}
#dbg{position:fixed;left:4px;bottom:calc(64px + var(--sab));z-index:30;font:10px monospace;background:#200;color:#f88;padding:2px 5px;border-radius:5px;opacity:.7;pointer-events:none}
/* ===== Hefau: ancient Egyptian skin (gold, lapis, turquoise, carnelian, sand, black) ===== */
:root{--lapis:#1d47b8;--turq:#22b5a2;--carn:#c62a1c;--sand:#d9bf86;--papyrus:#e8d3a0;--ink:#3a2410;
  --inlay:repeating-linear-gradient(90deg,#1d47b8 0 8px,#f2c14e 8px 10px,#c62a1c 10px 18px,#f2c14e 18px 20px,#22b5a2 20px 28px,#f2c14e 28px 30px);
  --egy:"EgyHiero","Noto Sans Egyptian Hieroglyphs",serif}
#app{background:radial-gradient(70% 40% at 50% 46%,#2a2250 0%,transparent 70%),linear-gradient(90deg,#3a080e 0%,transparent 16%,transparent 84%,#3a080e 100%),radial-gradient(120% 60% at 50% 48%,#170f04 0%,#060402 55%,#000 80%),#000}
#app::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;pointer-events:none;background:linear-gradient(0deg,#2a1d0a55,transparent)}
/* logo */
.hlogo{display:flex;align-items:center;gap:8px;line-height:1}
.cart{position:relative;display:inline-flex;align-items:center;padding:3px 12px 3px 8px;border-radius:999px;border:1.5px solid #f2c14e;
  box-shadow:inset 0 0 0 2px #0a0703,inset 0 0 0 3px #f2c14e66,0 0 10px #f2c14e40;background:linear-gradient(180deg,#1a1206,#070402)}
.cart::after{content:"";position:absolute;right:-5px;top:16%;bottom:16%;width:3px;border-radius:2px;background:linear-gradient(180deg,#fff0b5,#f2c14e,#8a5c10)}
.cart i{font-style:normal;font-family:var(--egy);font-size:15px;letter-spacing:0;color:#f2c14e;
  background:linear-gradient(180deg,#fff4c6,#f2c14e 55%,#a8741c);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.hword{font-family:var(--disp);font-weight:800;letter-spacing:3px;white-space:nowrap;position:relative;
  background:linear-gradient(180deg,#fff4c6 0%,#f2c14e 45%,#a8741c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1.5px 0 #1d47b8) drop-shadow(0 0 6px #f2c14e55)}
.brand{flex-direction:column;gap:3px}
.brand .hlogo{gap:9px}.brand .hword{font-size:20px}
.brand .cart{padding:2px 9px 2px 6px}.brand .cart i{font-size:13px}
#menuLogo{display:flex;flex-direction:column;align-items:center;gap:4px;margin:2px 0 0}
#menuLogo .wing{width:min(64vw,230px);height:auto;display:block;filter:drop-shadow(0 0 8px #f2c14e40)}
#menuLogo .hlogo{flex-direction:column;gap:6px}
#menuLogo .cart{padding:5px 18px 5px 12px}#menuLogo .cart i{font-size:26px}
#menuLogo .cart::after{right:-7px;width:4px}
#menuLogo .hword{font-size:40px;letter-spacing:9px;padding-left:9px}
#menuLogo .snk{width:min(56vw,200px);height:auto;display:block;margin-top:-2px}
.lotus{height:16px;margin:8px 0 2px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 16%22%3E%3Cg fill=%22%23f2c14e%22%3E%3Cpath d=%22M10 15C6 11 4 7 3 2C6 5 8 8 10 11C12 8 14 5 17 2C16 7 14 11 10 15Z%22/%3E%3Cpath d=%22M10 15C9 10 9 6 10 1C11 6 11 10 10 15Z%22 fill=%22%2322b5a2%22/%3E%3Cpath d=%22M30 15C27 12 27 8 30 5C33 8 33 12 30 15Z%22 fill=%22%231d47b8%22 stroke=%22%23f2c14e%22 stroke-width=%221%22/%3E%3Crect x=%220%22 y=%2215%22 width=%2240%22 height=%221%22/%3E%3C/g%3E%3C/svg%3E") repeat-x center/40px 16px;opacity:.85}
/* header */
#top{position:relative;padding-bottom:4px}
#top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--inlay);opacity:.75;border-radius:2px}
.ibtn{border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#2a241c,#14100b);border:1px solid #6a5530;box-shadow:inset 0 0 0 2px #14100b,inset 0 0 0 3px #f2c14e30}
/* player cards: Egyptian frames */
.pl{border-radius:6px;border:1px solid #6a5530;background:linear-gradient(180deg,#1a140b,#0a0704);box-shadow:inset 0 0 0 3px #0a0704,inset 0 0 0 4px #f2c14e26;padding-bottom:10px}
.pl::after{content:"";position:absolute;left:4px;right:4px;bottom:3px;height:3px;background:var(--inlay);opacity:.55;border-radius:1px}
.pl.on::after{opacity:1}
.av{border-radius:50%;box-shadow:0 0 0 2px #f2c14e,0 0 0 4px #1d47b8,0 0 0 5px #f2c14e}
/* overlays & panels */
.ov{background:radial-gradient(60% 34% at 50% 26%,#2c2458b0,transparent 75%),linear-gradient(90deg,#420a12d8 0%,#12060600 18%,#12060600 82%,#420a12d8 100%),radial-gradient(90% 70% at 50% 45%,#120b03f2,#000000f7)}
.card{border-radius:10px;border:1.5px solid #8a6a2c;box-shadow:0 0 50px #f2c14e1c,inset 0 0 0 4px #070502,inset 0 0 0 5px #f2c14e40;
  background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 72 12%22%3E%3Cg fill=%22none%22 stroke=%22%23f2c14e%22 stroke-width=%221.1%22 stroke-linecap=%22round%22 opacity=%22.75%22%3E %3Cpath d=%22M6 5a2 2.4 0 1 1 .01 0M3 6h6M6 6v5%22/%3E %3Cpath d=%22M18 2v9M15 4h6M15 6h6M15 8h6M16 11h4%22/%3E %3Cpath d=%22M26 7l2-2 2 2 2-2 2 2 2-2 2 2%22/%3E %3Cpath d=%22M44 11V3q2-2 3 0M42 11h6%22/%3E %3Cpath d=%22M54 6c0-3 6-3 6 0s-6 3-6 0M57 3V1M57 9v2%22/%3E %3Ccircle cx=%2267%22 cy=%226%22 r=%222.5%22/%3E%3C/g%3E%3C/svg%3E") repeat-x left 10px top 9px/72px 12px,url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 72 12%22%3E%3Cg fill=%22none%22 stroke=%22%23f2c14e%22 stroke-width=%221.1%22 stroke-linecap=%22round%22 opacity=%22.75%22%3E %3Cpath d=%22M6 5a2 2.4 0 1 1 .01 0M3 6h6M6 6v5%22/%3E %3Cpath d=%22M18 2v9M15 4h6M15 6h6M15 8h6M16 11h4%22/%3E %3Cpath d=%22M26 7l2-2 2 2 2-2 2 2 2-2 2 2%22/%3E %3Cpath d=%22M44 11V3q2-2 3 0M42 11h6%22/%3E %3Cpath d=%22M54 6c0-3 6-3 6 0s-6 3-6 0M57 3V1M57 9v2%22/%3E %3Ccircle cx=%2267%22 cy=%226%22 r=%222.5%22/%3E%3C/g%3E%3C/svg%3E") repeat-x left 10px bottom 9px/72px 12px,linear-gradient(180deg,#140e06 0%,#070402 100%);padding:28px 18px 26px}
.card::before{inset:auto 12px 0 12px;top:auto;bottom:-1px;height:0;border:0}
.card h2{letter-spacing:3px}
/* buttons: stone tablets + gold cartouches */
.btn{border-radius:12px 12px 5px 5px;background:linear-gradient(180deg,#2c251c 0%,#1a150f 55%,#110d09 100%);border:1px solid #6a5530;

.btn.gold{padding-right:30px;padding-left:30px}

/* mini & win */
#miniTitle,#winTitle{margin-top:4px}
.wingTop{display:block;width:min(70vw,250px);margin:-6px auto 2px;position:relative;filter:drop-shadow(0 0 10px #f2c14e55)}

/* ===== cinematic intro (one canvas, pre-rendered sprites) ===== */
#intro{position:fixed;inset:0;z-index:60;overflow:hidden;background:radial-gradient(80% 60% at 50% 40%,#1e1405 0%,#070402 55%,#000 85%);transition:opacity .8s ease}
#intro.out{opacity:0;pointer-events:none}
#iCv,#iBg{position:absolute;inset:0;width:100%;height:100%}
#iSkip{position:absolute;right:calc(14px + var(--sar));top:calc(12px + var(--sat));font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:1px;color:#f2c14e;padding:8px 14px;border-radius:999px;border:1px solid #f2c14e66;background:#0008}
#iSound{position:absolute;left:0;right:0;bottom:calc(26px + var(--sab));text-align:center;font-size:13px;color:#d8c08a;letter-spacing:.5px;opacity:0;transition:opacity .4s}
#iSound::before{content:"♪ ";color:#f2c14e}
#intro.iplay #iSound{animation:iFade .6s ease-out 1.2s both}
#iSound.gone{opacity:0!important;animation:none!important}
@keyframes iWing{from{opacity:0;transform:scaleX(0) translateY(10px)}40%{opacity:1}to{opacity:1;transform:none}}
@keyframes iCart{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes iLetter{from{opacity:0;transform:translateY(22px) scale(.9)}to{opacity:1;transform:none}}
@keyframes iFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* screen transitions */
.ov:not([hidden]) .card{animation:cardIn .42s cubic-bezier(.2,.9,.25,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}
#stage.reveal{animation:boardIn .8s cubic-bezier(.2,.9,.25,1) both}
@keyframes boardIn{from{opacity:0;transform:scale(.82) rotate(-14deg)}to{opacity:1;transform:none}}
#stage.shake{animation:shk .34s linear}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}
#win .card.winIn .wingTop{animation:iWing 1s cubic-bezier(.2,1.25,.4,1) .1s both}
#win .card.winIn #winTitle{animation:iLetter .7s cubic-bezier(.2,1.3,.4,1) .45s both}
#win .card.winIn #winCv{animation:iCart .8s cubic-bezier(.2,1.2,.4,1) .25s both}
@media (prefers-reduced-motion:reduce){.ov:not([hidden]) .card,#stage.reveal,#stage.shake{animation:none}}

/* sound + language stay reachable above menus/overlays */
#langBtn,#muteBtn{position:relative;z-index:26}

body.introOn #app,body.introOn .ov{visibility:hidden}

/* promo harmony: turquoise/violet glow in highlights, warm candle gold */
.btn:active,.btn:focus-visible{box-shadow:0 0 0 1px #8ff5ea88,0 0 18px #9d8cff55}
.pl.on{box-shadow:0 0 0 1px #f2c14e,0 0 16px #f2c14e55,0 0 26px #7fe9e033}

#menu .row #m2p{padding-left:6px;padding-right:6px} #menu .row #m2p .ic2,#menu .row #m2p .ic3{width:22px;height:22px}

#onCode::placeholder{color:#f2c14e55}
#roomQr{width:min(56vw,220px);aspect-ratio:1;margin:4px auto 6px;padding:10px;border-radius:8px;background:radial-gradient(circle,#f1dfb0,#e2c88e);box-shadow:0 0 0 2px #f2c14e,0 0 0 5px #1d47b8,0 0 0 6px #f2c14e,0 0 24px #5fe3d655}
#roomQr svg{width:100%;height:100%;display:block}
#roomCode{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:9px;padding-left:9px;color:#fff0b5;text-shadow:0 2px 0 #1d47b8,0 0 14px #f2c14e88;margin:2px 0 6px}

#netBar{position:absolute;left:8px;top:6px;z-index:3;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:#000a;border:1px solid #5fe3d655;font-family:var(--disp);font-weight:800;font-size:11px;letter-spacing:1.5px;color:#9fe9e0}
#netBar i{width:8px;height:8px;border-radius:50%;background:#3ff0a0;box-shadow:0 0 8px #3ff0a0}
#netBar.warn i{background:#ffb02e;box-shadow:0 0 8px #ffb02e} #netBar.warn{color:#ffd28a;border-color:#ffb02e66}
#netBar.bad i{background:#ff4d6a;box-shadow:0 0 8px #ff4d6a} #netBar.bad{color:#ff9aaa;border-color:#ff4d6a66}

/* ===== v5 typography: Cinzel Decorative headings, shining gold lettering, lapis/violet glow (promo palette) ===== */
:root{--deco:"Hefau Deco","Cinzel",Georgia,serif;--lapis:#1d47b8;--turq:#3fe0d0;--violet:#a98bff}
.hword,.card h2,.title,#banner,#winTitle{font-family:var(--deco);font-weight:700}
.hword,.card h2,.title{
  background:linear-gradient(105deg,transparent 0 38%,rgba(255,252,235,.95) 47%,rgba(255,255,255,.98) 50%,rgba(255,252,235,.95) 53%,transparent 62% 100%) no-repeat,
             linear-gradient(180deg,#fff6d2 0%,#f7d77a 34%,#e2a93a 58%,#b97a1e 80%,#8a5410 100%);
  background-size:300% 100%,100% 100%;background-position:120% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1.5px 0 #0e2f86) drop-shadow(0 0 7px rgba(150,120,255,.42))}
#menuLogo .hword,.card h2,.title{animation:gshine 6.5s ease-in-out infinite}
#menuLogo .hword{filter:drop-shadow(0 2px 0 #0e2f86) drop-shadow(0 0 10px rgba(63,224,208,.35)) drop-shadow(0 0 18px rgba(169,139,255,.35))}
@keyframes gshine{0%,58%{background-position:120% 0,0 0}100%{background-position:-20% 0,0 0}}
.card h2{letter-spacing:2px;line-height:1.15}
/* hieroglyph ornaments flanking headings (decoration only, never words) */
.card>h2::before,.card>h2::after,#rules h2::before,#rules h2::after{font-family:EgyHiero;font-size:.62em;font-weight:400;letter-spacing:0;vertical-align:.18em;
  background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--turq);-webkit-text-fill-color:var(--turq);opacity:.85;text-shadow:0 0 6px rgba(63,224,208,.6)}
.card>h2::before,#rules h2::before{content:"\13080\00a0";margin-right:.25em}
.card>h2::after,#rules h2::after{content:"\00a0\132F9";margin-left:.25em}
#miniTitle::before,#miniTitle::after{content:none!important}
/* banners & win title */
#banner{color:#ffe8a8;text-shadow:0 1px 0 #0e2f86,0 0 12px rgba(242,193,78,.55),0 0 22px rgba(169,139,255,.35)}
/* buttons: gold cartouche with engraved dark lettering + sliding sheen; stone tablets with gold lettering */
.btn{color:#f6dc95;text-shadow:0 1px 0 #000,0 0 8px rgba(242,193,78,.25)}
.btn small{color:#d9ccb0;text-shadow:none}
.btn.gold,#rollBtn{color:#2a1500;text-shadow:0 1px 0 rgba(255,246,210,.75)}
.btn.gold{overflow:hidden}
.btn.gold::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:translateX(-160%) skewX(-20deg);animation:sheenT 4.2s ease-in-out infinite;will-change:transform}
#rollBtn::after{left:0;transform:translateX(-160%) skewX(-20deg);animation:sheenT 3.2s ease-in-out infinite;will-change:transform}
@keyframes sheenT{0%,62%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(330%) skewX(-20deg)}}
.btn:not(.gold){border-color:#7a6236;box-shadow:inset 0 0 0 3px #110d09,inset 0 0 0 4px rgba(63,224,208,.22),0 3px 0 #000,0 0 14px rgba(29,71,184,.18)}
@media (prefers-reduced-motion:reduce){#menuLogo .hword,.card h2,.title,.btn.gold::after,#rollBtn::after{animation:none}}
@media (max-width:360px){#menu .row .btn{font-size:13.5px;letter-spacing:.2px}}
/* promo palette glow on panels (static, cheap) */
.ov .card{box-shadow:0 0 0 1px rgba(242,193,78,.14),0 0 46px rgba(150,120,255,.16),0 0 90px rgba(63,224,208,.07),inset 0 1px 0 rgba(242,193,78,.14)}
/* ===== v6 cobra emblem at the spiral centre: head + spread hood, compositor-only motion ===== */
#cobra{position:absolute;pointer-events:none;transform-origin:50% 84%;animation:cbSway 7.4s ease-in-out infinite;will-change:transform}
#cobra canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#cbHood{transform-origin:50% 84%;animation:cbBreath 6.2s ease-in-out infinite;will-change:transform}
#cbHead{transform-origin:50% 40%;animation:cbHeadBob 6.2s ease-in-out infinite;will-change:transform}
#cbEyes{mix-blend-mode:screen;transform-origin:50% 40%;animation:cbHeadBob 6.2s ease-in-out infinite,cbGlow 2.9s ease-in-out infinite alternate;will-change:transform,opacity}
#cbTongue{transform-origin:50% 37%;transform:scaleY(0);animation:cbTongue 5.3s linear infinite;will-change:transform}
@keyframes cbSway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
@keyframes cbBreath{0%,100%{transform:scale(1,1)}38%{transform:scale(1.035,1.01)}50%{transform:scale(1.075,1.02)}62%{transform:scale(1.03,1.008)}}
@keyframes cbHeadBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.1%)}}
@keyframes cbGlow{0%{opacity:.45}100%{opacity:1}}
@keyframes cbTongue{0%,86%{transform:scaleY(0)}88%{transform:scaleY(1)}90%{transform:scaleY(.35)}92%{transform:scaleY(1)}94.5%,100%{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){#cobra,#cbHood,#cbHead,#cbEyes,#cbTongue{animation:none}#cbEyes{opacity:.85}}
#cbShine{position:absolute;inset:0;transform-origin:50% 84%;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;mix-blend-mode:screen;
  background:linear-gradient(112deg,transparent 0 46.5%,rgba(255,236,170,.35) 48.6%,rgba(255,252,232,.9) 50%,rgba(255,236,170,.35) 51.4%,transparent 53.5% 100%) no-repeat;background-size:420% 100%;background-position:115% 0;
  animation:cbBreath 6.2s ease-in-out infinite,cbShine 8.3s ease-in-out infinite;will-change:transform}
@keyframes cbShine{0%,72%{background-position:115% 0}100%{background-position:-15% 0}}
@media (prefers-reduced-motion:reduce){#cbShine{animation:none;display:none}}

</style>

<script>

var MC = (function () {

    for (var i = 3; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    for (var k = 0; k < light; k++) a[idx[k]] = 1; return a;

  function kind(pos) { if (SAFE.indexOf(pos) >= 0) return 'safe'; if (EYE.indexOf(pos) >= 0) return 'eye'; if (STING.indexOf(pos) >= 0) return 'sting'; return 'plain'; }
  function newGame(mode, diff) {
    return { v: 1, mode: mode, diff: diff || 'hard', lions: [[0, 0, 0], [0, 0, 0]], turn: 0, phase: 'roll', roll: null, sticks: null,
      mini: null, winner: null, turns: 0, caps: [0, 0], minis: [0, 0], last: null, startedAt: Date.now() };
  }
  function occupant(s, pos) { // returns {p,i} or null (head can hold many)
    if (pos <= 0 || pos >= HEAD) return null;
    for (var p = 0; p < 2; p++) for (var i = 0; i < LIONS; i++) if (s.lions[p][i] === pos) return { p: p, i: i };
    return null;
  }
  function landingOk(s, p, to) { // can player p land on pos `to`? returns {ok, cap}
    if (to >= HEAD) return { ok: true, cap: null };
    var o = occupant(s, to);
    if (!o) return { ok: true, cap: null };
    if (o.p === p) return { ok: false };
    if (kind(to) === 'safe') return { ok: false };
    return { ok: true, cap: o };
  }
  function legalMoves(s, p, roll) {
    var out = [], seenHome = false;
    for (var i = 0; i < LIONS; i++) {
      var from = s.lions[p][i];
      if (from >= HEAD) continue;
      if (from === 0) { if (seenHome) continue; seenHome = true; } // home lions are equivalent
      var to = Math.min(from + roll, HEAD), L = landingOk(s, p, to);
      if (L.ok) out.push({ p: p, lion: i, from: from, to: to, cap: L.cap });
    }
    return out;
  }
  function homeLionsAll(s, p) { var r = []; for (var i = 0; i < LIONS; i++) if (s.lions[p][i] === 0) r.push(i); return r; }
  function checkWin(s) { for (var p = 0; p < 2; p++) { var all = true; for (var i = 0; i < LIONS; i++) if (s.lions[p][i] < HEAD) all = false; if (all) { s.winner = p; s.phase = 'over'; return true; } } return false; }
  // apply chosen move; returns event list
  function applyMove(s, m) {
    var ev = [];
    if (m.cap) { s.lions[m.cap.p][m.cap.i] = 0; s.caps[m.p]++; ev.push({ t: 'cap', p: m.cap.p, i: m.cap.i, at: m.to }); }
    s.lions[m.p][m.lion] = m.to;
    s.last = { p: m.p, lion: m.lion, from: m.from, to: m.to };
    if (m.to >= HEAD) ev.push({ t: 'home', p: m.p, i: m.lion });
    if (checkWin(s)) { ev.push({ t: 'win', p: s.winner }); return ev; }
    var k = kind(m.to);

    return ev;
  }
  function bonusTarget(s, p, pos) { // furthest legal landing up to +BONUS
    for (var d = BONUS; d >= 1; d--) { var to = Math.min(pos + d, HEAD), L = landingOk(s, p, to); if (L.ok) return { to: to, cap: L.cap }; }
    return null;

  function penaltyTarget(s, p, pos) { // back PENALTY, then further back to first free segment; 0 = home
    for (var to = pos - PENALTY; to > 0; to--) if (!occupant(s, to)) return to;
    return 0;
  }
  function resolveMini(s, success) {
    var m = s.mini, ev = [];
    if (!m) return ev;
    var pos = s.lions[m.p][m.lion];
    if (success) s.minis[m.p]++;
    if (m.kind === 'eye' && success) {
      var b = bonusTarget(s, m.p, pos);
      if (b) {
        if (b.cap) { s.lions[b.cap.p][b.cap.i] = 0; s.caps[m.p]++; ev.push({ t: 'cap', p: b.cap.p, i: b.cap.i, at: b.to }); }
        s.lions[m.p][m.lion] = b.to; ev.push({ t: 'bonus', from: pos, to: b.to });
        if (b.to >= HEAD) ev.push({ t: 'home', p: m.p, i: m.lion });
      } else ev.push({ t: 'bonusBlocked' });

      var to = penaltyTarget(s, m.p, pos);
      s.lions[m.p][m.lion] = to; ev.push({ t: 'back', from: pos, to: to });
    } else ev.push({ t: success ? 'avoided' : 'nothing' });

    if (checkWin(s)) ev.push({ t: 'win', p: s.winner });
    return ev;
  }
  function nextTurn(s) { // after move/pass
    if (s.winner != null) { s.phase = 'over'; return { extra: false }; }
    var extra = s.roll >= 4;
    if (!extra) s.turn = 1 - s.turn;
    s.turns++; s.phase = 'roll'; s.roll = null; s.sticks = null;
    return { extra: extra };
  }
  // ---------- AI ----------
  function threat(s, p, pos, extraEmpty) { // probability-weighted danger of being captured at pos by opponent next throw
    if (pos <= 0 || pos >= HEAD || kind(pos) === 'safe') return 0;
    var o = 1 - p, t = 0, homeCounted = false;
    for (var i = 0; i < LIONS; i++) {
      var q = s.lions[o][i];
      if (q >= HEAD) continue;
      if (q === 0) { if (homeCounted) continue; homeCounted = true; }
      var d = pos - q; if (d >= 1 && d <= 5) t += PROB[d];
    }
    return Math.min(1, t);
  }
  function scoreMove(s, m, miniP) {
    var sc = (m.to - m.from) * 1.0, k = kind(m.to);
    if (m.cap) sc += 10 + s.lions[m.cap.p][m.cap.i] * 0.6;
    if (m.to >= HEAD) sc += 7;
    if (m.from === 0) sc += 1.5;
    if (k === 'safe') sc += 3;
    if (k === 'eye') sc += BONUS * miniP + 1;
    if (k === 'sting') sc -= PENALTY * (1 - miniP) + 1;
    // simulate to evaluate risk
    var c = JSON.parse(JSON.stringify(s)); if (m.cap) c.lions[m.cap.p][m.cap.i] = 0; c.lions[m.p][m.lion] = m.to;
    sc -= threat(c, m.p, m.to) * (4 + m.to * 0.7);
    sc += threat(s, m.p, m.from) * (4 + m.from * 0.7);
    return sc;
  }
  function aiChoose(s, roll, diff, rnd) {
    rnd = rnd || Math.random;
    var ms = legalMoves(s, s.turn, roll);
    if (!ms.length) return null;
    if (diff === 'easy') {
      if (rnd() < 0.45) return ms[Math.floor(rnd() * ms.length)];
      var b = ms[0]; ms.forEach(function (m) { if ((m.cap ? 5 : 0) + m.to > (b.cap ? 5 : 0) + b.to) b = m; }); return b;
    }
    var best = null, bs = -1e9;
    ms.forEach(function (m) { var v = scoreMove(s, m, 0.75) + rnd() * 0.01; if (v > bs) { bs = v; best = m; } });
    return best;
  }
  function valid(s) {
    try { return s && s.v === 1 && s.lions && s.lions.length === 2 && s.lions[0].length === LIONS && ['roll', 'move', 'mini', 'after', 'over'].indexOf(s.phase) >= 0; } catch (e) { return false; }
  }
  return { N: N, HEAD: HEAD, LIONS: LIONS, SAFE: SAFE, EYE: EYE, STING: STING, BONUS: BONUS, PENALTY: PENALTY, PROB: PROB,
    sticksValue: sticksValue, randomSticks: randomSticks, sticksFor: sticksFor, kind: kind, newGame: newGame, occupant: occupant,
    legalMoves: legalMoves, homeLionsAll: homeLionsAll, applyMove: applyMove, resolveMini: resolveMini, nextTurn: nextTurn,
    aiChoose: aiChoose, threat: threat, valid: valid, landingOk: landingOk };
})();
