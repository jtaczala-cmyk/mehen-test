<style>
:root{
  --bg:#000; --panel:#0b0906; --panel2:#15110a; --line:#3a2e14; --txt:#f6ecd2; --mut:#a8987a;
  --gold:#f5c542; --gold2:#ffdf7e; --p0:#ffb02e; --p1:#22e0d0; --red:#ff3b5c; --green:#47f59a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior:none}

#app{position:relative;margin:0 auto;max-width:540px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:calc(4px + var(--sat)) calc(8px + var(--sar)) calc(4px + var(--sab)) calc(8px + var(--sal));overflow:hidden}
@media (min-width:700px){#app{border-left:1px solid #1c160a;border-right:1px solid #1c160a;box-shadow:0 0 90px #f5c54214}}

.brand{flex:1;min-width:0;line-height:1.05}

.ibtn{min-width:36px;height:36px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:700;display:grid;place-items:center;padding:0 7px;color:var(--gold2)}
.ibtn:active{transform:scale(.93)}
#players{display:flex;gap:6px;margin:4px 0 2px}
.pl{flex:1;min-width:0;border-radius:14px;padding:5px 8px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;transition:box-shadow .3s,border-color .3s,opacity .3s;opacity:.55}
.pl.on{opacity:1}
.pl[data-p="0"].on{border-color:var(--p0);box-shadow:0 0 16px #ffb02e55,inset 0 0 12px #ffb02e22}
.pl[data-p="1"].on{border-color:var(--p1);box-shadow:0 0 16px #22e0d055,inset 0 0 12px #22e0d022}
.pl .nm{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}

.pl[data-p="0"] .nm i{background:var(--p0);box-shadow:0 0 8px var(--p0)} .pl[data-p="1"] .nm i{background:var(--p1);box-shadow:0 0 8px var(--p1)}
.pl .tray{display:flex;align-items:center;gap:3px;min-height:30px}
.tok{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto;touch-action:none}
.tok canvas{width:28px;height:28px;pointer-events:none}
.tok.gone{opacity:.18}
.tok.can{animation:glow 1s ease-in-out infinite;cursor:pointer}
.tok.done::after{content:"☥";position:absolute;right:-3px;bottom:-4px;font-size:12px;color:var(--gold);text-shadow:0 0 6px #000}
.pl .lbl2{font-size:10px;line-height:1.2;color:var(--mut);margin-left:auto;white-space:nowrap;text-align:right}

.btn small{display:block;font-size:11.5px;font-weight:600;opacity:.75;margin-top:2px}

.row{display:flex;gap:8px}.row .btn{flex:1}
#menuArt{display:block;margin:0 auto 4px;width:150px;height:150px}

#miniCv{width:min(66vw,250px);height:min(66vw,250px);display:block;margin:4px auto;touch-action:none}
#miniTap{margin-top:6px;height:64px;font-size:20px}
#miniMsg{min-height:22px;font-weight:800;font-size:17px;color:var(--gold2)}
.key{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid #5cf5a8}
#dbg{position:fixed;left:4px;bottom:calc(64px + var(--sab));z-index:30;font:10px monospace;background:#200;color:#f88;padding:2px 5px;border-radius:5px;opacity:.7;pointer-events:none}
</style>

<script>
/*CORE-START*/
var MC = (function () {
  var N = 30, HEAD = N + 1, LIONS = 3;
  var SAFE = [6, 12, 18, 24], EYE = [4, 14, 20, 27], STING = [9, 16, 22, 29];
  var BONUS = 3, PENALTY = 3;
  // 4 two-sided sticks: count of light (flat) sides up; 0 light = 5
  function sticksValue(st) { var c = 0; for (var i = 0; i < st.length; i++) c += st[i] ? 1 : 0; return c === 0 ? 5 : c; }
  function randomSticks(rnd) { rnd = rnd || Math.random; var a = []; for (var i = 0; i < 4; i++) a.push(rnd() < 0.5 ? 1 : 0); return a; }
  function sticksFor(v, rnd) { // random stick arrangement giving value v
    rnd = rnd || Math.random; var light = v === 5 ? 0 : v, a = [0, 0, 0, 0], idx = [0, 1, 2, 3];
    for (var i = 3; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    for (var k = 0; k < light; k++) a[idx[k]] = 1; return a;
  }
  var PROB = { 1: 4 / 16, 2: 6 / 16, 3: 4 / 16, 4: 1 / 16, 5: 1 / 16 };
  function kind(pos) { if (SAFE.indexOf(pos) >= 0) return 'safe'; if (EYE.indexOf(pos) >= 0) return 'eye'; if (STING.indexOf(pos) >= 0) return 'sting'; return 'plain'; }
  function newGame(mode, diff) {
    return { v: 1, mode: mode, diff: diff || 'hard', lions: [[0, 0, 0], [0, 0, 0]], turn: 0, phase: 'roll', roll: null, sticks: null,
      mini: null, winner: null, turns: 0, caps: [0, 0], minis: [0, 0], last: null, startedAt: Date.now() };
  }
  function occupant(s, pos) { // returns {p,i} or null (head can hold many)
    if (pos <= 0 || pos >= HEAD) return null;
    for (var p = 0; p < 2; p++) for (var i = 0; i < LIONS; i++) if (s.lions[p][i] === pos) return { p: p, i: i };
    return null;
  }
  function landingOk(s, p, to) { // can player p land on pos `to`? returns {ok, cap}
    if (to >= HEAD) return { ok: true, cap: null };
    var o = occupant(s, to);
    if (!o) return { ok: true, cap: null };
    if (o.p === p) return { ok: false };
    if (kind(to) === 'safe') return { ok: false };
    return { ok: true, cap: o };
  }
  function legalMoves(s, p, roll) {
    var out = [], seenHome = false;
    for (var i = 0; i < LIONS; i++) {
      var from = s.lions[p][i];
      if (from >= HEAD) continue;
      if (from === 0) { if (seenHome) continue; seenHome = true; } // home lions are equivalent
      var to = Math.min(from + roll, HEAD), L = landingOk(s, p, to);
      if (L.ok) out.push({ p: p, lion: i, from: from, to: to, cap: L.cap });
    }
    return out;
  }
  function homeLionsAll(s, p) { var r = []; for (var i = 0; i < LIONS; i++) if (s.lions[p][i] === 0) r.push(i); return r; }
  function checkWin(s) { for (var p = 0; p < 2; p++) { var all = true; for (var i = 0; i < LIONS; i++) if (s.lions[p][i] < HEAD) all = false; if (all) { s.winner = p; s.phase = 'over'; return true; } } return false; }
  // apply chosen move; returns event list
  function applyMove(s, m) {
    var ev = [];
    if (m.cap) { s.lions[m.cap.p][m.cap.i] = 0; s.caps[m.p]++; ev.push({ t: 'cap', p: m.cap.p, i: m.cap.i, at: m.to }); }
    s.lions[m.p][m.lion] = m.to;
    s.last = { p: m.p, lion: m.lion, from: m.from, to: m.to };
    if (m.to >= HEAD) ev.push({ t: 'home', p: m.p, i: m.lion });
    if (checkWin(s)) { ev.push({ t: 'win', p: s.winner }); return ev; }
    var k = kind(m.to);
    if (k === 'eye' || k === 'sting') { s.phase = 'mini'; s.mini = { kind: k, p: m.p, lion: m.lion }; ev.push({ t: 'mini', kind: k }); }
    else s.phase = 'after';
    return ev;
  }
  function bonusTarget(s, p, pos) { // furthest legal landing up to +BONUS
    for (var d = BONUS; d >= 1; d--) { var to = Math.min(pos + d, HEAD), L = landingOk(s, p, to); if (L.ok) return { to: to, cap: L.cap }; }
    return null;
  }
  function penaltyTarget(s, p, pos) { // back PENALTY, then further back to first free segment; 0 = home
    for (var to = pos - PENALTY; to > 0; to--) if (!occupant(s, to)) return to;
    return 0;
  }
  function resolveMini(s, success) {
    var m = s.mini, ev = [];
    if (!m) return ev;
    var pos = s.lions[m.p][m.lion];
    if (success) s.minis[m.p]++;
    if (m.kind === 'eye' && success) {
      var b = bonusTarget(s, m.p, pos);
      if (b) {
        if (b.cap) { s.lions[b.cap.p][b.cap.i] = 0; s.caps[m.p]++; ev.push({ t: 'cap', p: b.cap.p, i: b.cap.i, at: b.to }); }
        s.lions[m.p][m.lion] = b.to; ev.push({ t: 'bonus', from: pos, to: b.to });
        if (b.to >= HEAD) ev.push({ t: 'home', p: m.p, i: m.lion });
      } else ev.push({ t: 'bonusBlocked' });
    } else if (m.kind === 'sting' && !success) {
      var to = penaltyTarget(s, m.p, pos);
      s.lions[m.p][m.lion] = to; ev.push({ t: 'back', from: pos, to: to });
    } else ev.push({ t: success ? 'avoided' : 'nothing' });
    s.mini = null; s.phase = 'after';
    if (checkWin(s)) ev.push({ t: 'win', p: s.winner });
    return ev;
  }
  function nextTurn(s) { // after move/pass
    if (s.winner != null) { s.phase = 'over'; return { extra: false }; }
    var extra = s.roll >= 4;
    if (!extra) s.turn = 1 - s.turn;
    s.turns++; s.phase = 'roll'; s.roll = null; s.sticks = null;
    return { extra: extra };
  }
  // ---------- AI ----------
  function threat(s, p, pos, extraEmpty) { // probability-weighted danger of being captured at pos by opponent next throw
    if (pos <= 0 || pos >= HEAD || kind(pos) === 'safe') return 0;
    var o = 1 - p, t = 0, homeCounted = false;
    for (var i = 0; i < LIONS; i++) {
      var q = s.lions[o][i];
      if (q >= HEAD) continue;
      if (q === 0) { if (homeCounted) continue; homeCounted = true; }
      var d = pos - q; if (d >= 1 && d <= 5) t += PROB[d];
    }
    return Math.min(1, t);
  }
  function scoreMove(s, m, miniP) {
    var sc = (m.to - m.from) * 1.0, k = kind(m.to);
    if (m.cap) sc += 10 + s.lions[m.cap.p][m.cap.i] * 0.6;
    if (m.to >= HEAD) sc += 7;
    if (m.from === 0) sc += 1.5;
    if (k === 'safe') sc += 3;
    if (k === 'eye') sc += BONUS * miniP + 1;
    if (k === 'sting') sc -= PENALTY * (1 - miniP) + 1;
    // simulate to evaluate risk
    var c = JSON.parse(JSON.stringify(s)); if (m.cap) c.lions[m.cap.p][m.cap.i] = 0; c.lions[m.p][m.lion] = m.to;
    sc -= threat(c, m.p, m.to) * (4 + m.to * 0.7);
    sc += threat(s, m.p, m.from) * (4 + m.from * 0.7);
    return sc;
  }
  function aiChoose(s, roll, diff, rnd) {
    rnd = rnd || Math.random;
    var ms = legalMoves(s, s.turn, roll);
    if (!ms.length) return null;
    if (diff === 'easy') {
      if (rnd() < 0.45) return ms[Math.floor(rnd() * ms.length)];
      var b = ms[0]; ms.forEach(function (m) { if ((m.cap ? 5 : 0) + m.to > (b.cap ? 5 : 0) + b.to) b = m; }); return b;
    }
    var best = null, bs = -1e9;
    ms.forEach(function (m) { var v = scoreMove(s, m, 0.75) + rnd() * 0.01; if (v > bs) { bs = v; best = m; } });
    return best;
  }
  function valid(s) {
    try { return s && s.v === 1 && s.lions && s.lions.length === 2 && s.lions[0].length === LIONS && ['roll', 'move', 'mini', 'after', 'over'].indexOf(s.phase) >= 0; } catch (e) { return false; }
  }
  return { N: N, HEAD: HEAD, LIONS: LIONS, SAFE: SAFE, EYE: EYE, STING: STING, BONUS: BONUS, PENALTY: PENALTY, PROB: PROB,
    sticksValue: sticksValue, randomSticks: randomSticks, sticksFor: sticksFor, kind: kind, newGame: newGame, occupant: occupant,
    legalMoves: legalMoves, homeLionsAll: homeLionsAll, applyMove: applyMove, resolveMini: resolveMini, nextTurn: nextTurn,
    aiChoose: aiChoose, threat: threat, valid: valid, landingOk: landingOk };
})();
/*CORE-END*/
(function () {
'use strict';
var DEBUG = /[?&]debug=1(&|$)/.test(location.search);
var SAVE_KEY = 'mehen_test_save_v1', PREF_KEY = 'mehen_test_prefs_v1';
var $ = function (id) { return document.getElementById(id); };

  if (!S || S.phase === 'over') return;
  var r = MC.nextTurn(S); save(); renderUI();
  busy = true;
  if (r.extra) { banner(t('extra'), t('extraSub'), 1000); sfx('good'); await wait(900); }
  else if (S.mode === '2p') { banner(t('turnOf', { name: pname(S.turn) }), t('passPhone'), 1100); sfx('turn'); await wait(700); }
  busy = false;
  startTurn();
}
var aiTimer = 0;
function startTurn() {
  renderUI();
  if (S && S.phase === 'roll' && isAI(S.turn) && $('menu').hidden) { clearTimeout(aiTimer); aiTimer = setTimeout(function () { doRoll('ai'); }, 700 * SPEED); }
}
function resumeGame() {
  busy = false; renderUI();
  if (S.phase === 'roll') startTurn();
  else if (S.phase === 'move') {
    if (!MC.legalMoves(S, S.turn, S.roll).length) { afterTurn(); return; }
    if (isAI(S.turn)) setTimeout(function () { executeMove(MC.aiChoose(S, S.roll, S.diff)); }, 600 * SPEED);
  } else if (S.phase === 'mini') runMini();
  else if (S.phase === 'after') afterTurn();

/* ---------------- pointer: tap a lion / trace along the scales ---------------- */
function boardPt(ev) { var r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) * SZ / r.width, y: (ev.clientY - r.top) * SZ / r.height }; }
function hitSeg(pt, tol) {
  var best = -1, bd = 1e9;
  for (var i = 1; i <= MC.N; i++) { var s = G.segs[i], d = Math.hypot(pt.x - s.x, pt.y - s.y); if (d < bd) { bd = d; best = i; } }
  var dh = Math.hypot(pt.x - G.c, pt.y - G.c); if (dh < G.headR + 4 && dh < bd) return MC.HEAD;
  return bd < G.w * (tol || 0.75) ? best : -1;
}
function lionAt(pt) {
  for (var i = 0; i < MC.LIONS; i++) { var pos = S.lions[S.turn][i]; if (pos <= 0 || pos >= MC.HEAD) continue; var q = posXY(pos); if (Math.hypot(pt.x - q.x, pt.y - q.y) < G.tokR * 1.4) return i; }
  return -1;
}
var drag = null;
function startDrag(m, ev, fromTray) { drag = { m: m, prog: m.from, path: [], moved: false, x0: ev.clientX, y0: ev.clientY, fromTray: !!fromTray }; }
cv.addEventListener('pointerdown', function (ev) {
  if (!S) return;
  var lm = legalNow();
  if (!lm.length) { if (S.phase === 'roll' && !isAI(S.turn) && !busy) hint(t('throwFirst')); return; }
  ac(); var pt = boardPt(ev), li = lionAt(pt);
  if (li >= 0) { var m = lm.find(function (x) { return x.lion === li; }); if (m) { startDrag(m, ev); try { cv.setPointerCapture(ev.pointerId); } catch (e) {} } else hint(t('cantMove')); return; }
  if (Math.hypot(pt.x - G.entry.x, pt.y - G.entry.y) < G.tokR * 1.5) { var mh = lm.find(function (x) { return x.from === 0; }); if (mh) { startDrag(mh, ev); try { cv.setPointerCapture(ev.pointerId); } catch (e) {} return; } }
  var sgi = hitSeg(pt, 0.6), tm = lm.filter(function (x) { return x.to === sgi; });
  if (tm.length) { tm.sort(function (a, b) { return b.from - a.from; }); executeMove(tm[0]); return; }
  hint(t('pickHint'));
});
function dragMove(ev) {
  if (!drag) return;
  if (!drag.moved && Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0) > 10) drag.moved = true;
  if (!drag.moved) return;
  var pt = boardPt(ev), m = drag.m, sgi = hitSeg(pt, 0.95);
  if (sgi < 0) return;
  var target = m.to;
  if (sgi > drag.prog && sgi <= Math.min(target, drag.prog + 2)) {
    for (var k = drag.prog + 1; k <= sgi; k++) { drag.path.push(k); sfx('step'); vib('step'); }
    drag.prog = sgi; trail = drag.path.slice(); initDisp(); var q = posXY(sgi, m.p, m.lion); disp[m.p][m.lion] = { x: q.x, y: q.y, s: 1.1 };
    if (drag.prog >= target) { var mm = m; drag = null; executeMove(mm, q); }
  } else if (sgi === MC.HEAD && target === MC.HEAD && drag.prog >= MC.N - 3) { var m2 = m; drag = null; sfx('step'); executeMove(m2, posXY(Math.max(1, m2.from))); }
}
function dragEnd() {
  if (!drag) return; var d = drag; drag = null;
  if (!d.moved) { executeMove(d.m); return; }
  trail = null; disp = null; hint(t('dragHint'));
}
cv.addEventListener('pointermove', function (e) { if (drag && !drag.fromTray) dragMove(e); });
cv.addEventListener('pointerup', function () { if (drag && !drag.fromTray) dragEnd(); });
cv.addEventListener('pointercancel', function () { drag = null; trail = null; disp = null; });
window.addEventListener('pointermove', function (e) { if (drag && drag.fromTray) dragMove(e); });
window.addEventListener('pointerup', function () { if (drag && drag.fromTray) dragEnd(); });
window.addEventListener('pointercancel', function () { if (drag && drag.fromTray) { drag = null; trail = null; disp = null; } });
$('players').addEventListener('pointerdown', function (ev) {
  var tok = ev.target.closest('.tok'); if (!tok || !S) return; var lm = legalNow(); if (!lm.length) return;
  var p = +tok.dataset.p; if (p !== S.turn || S.lions[p][+tok.dataset.i] !== 0) return;
  var m = lm.find(function (x) { return x.from === 0; }); if (!m) return;
  ac(); startDrag(m, ev, true); ev.preventDefault();
  try { tok.releasePointerCapture && tok.releasePointerCapture(ev.pointerId); } catch (e) {}
});

/* ---------------- shake to throw ---------------- */
var motionOn = false, lastShake = 0, motionAsked = false;
function onMotion(e) {
  try {
    var a = e && e.acceleration && e.acceleration.x != null ? e.acceleration : null, g = e && e.accelerationIncludingGravity, mag = 0;
    if (a) mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    else if (g && g.x != null) mag = Math.abs(Math.hypot(g.x || 0, g.y || 0, g.z || 0) - 9.81);
    if (mag > 13 && Date.now() - lastShake > 1500 && S && S.phase === 'roll' && !busy && !isAI(S.turn) && $('menu').hidden && $('mini').hidden && $('rules').hidden && $('win').hidden) { lastShake = Date.now(); doRoll('shake'); }
  } catch (err) {}
}
function enableMotion() { // call from a user gesture (iOS 13+ requires it)
  if (motionAsked) return; motionAsked = true;
  try {
    var DME = window.DeviceMotionEvent;
    if (!DME) return;
    if (typeof DME.requestPermission === 'function') {
      DME.requestPermission().then(function (st) { if (st === 'granted') { window.addEventListener('devicemotion', onMotion); motionOn = true; renderUI(); } }).catch(function () {});
    } else if ('ontouchstart' in window || navigator.maxTouchPoints > 0) { window.addEventListener('devicemotion', onMotion); motionOn = true; }
  } catch (e) {}
}

/* ---------------- reflex mini-game: tap on the heartbeat ---------------- */
var mcv = $('miniCv'), mcx = mcv.getContext('2d');
var MINI = { period: 1000, win: 130, lead: 1200, beats: 4 };
var miniSt = null;
function heartPath(c, s) { c.beginPath(); c.moveTo(0, s * 0.35); c.bezierCurveTo(-s * 1.1, -s * 0.35, -s * 0.5, -s * 1.05, 0, -s * 0.45); c.bezierCurveTo(s * 0.5, -s * 1.05, s * 1.1, -s * 0.35, 0, s * 0.35); c.closePath(); }
function drawMini(now) {
  var W = mcv.width, C = W / 2; mcx.clearRect(0, 0, W, W);
  var ms = miniSt; if (!ms) return;
  var near = 1e9, k;
  for (k = 0; k < ms.beats.length; k++) { var d = now - ms.beats[k]; if (Math.abs(d) < Math.abs(near)) near = d; }
  mcx.save(); mcx.translate(C, C);
  for (var j = 0; j < 40; j++) { var a = j / 40 * Math.PI * 2 + now / 3000; mcx.fillStyle = j % 2 ? '#2a1e08' : '#3a2a0c'; mcx.strokeStyle = '#f5c54266'; mcx.lineWidth = 2; mcx.beginPath(); mcx.ellipse(Math.cos(a) * W * 0.42, Math.sin(a) * W * 0.42, W * 0.045, W * 0.03, a + Math.PI / 2, 0, 7); mcx.fill(); mcx.stroke(); }
  var hs = W * 0.17, pulse = Math.max(0, 1 - Math.abs(near) / 160);
  mcx.strokeStyle = '#f5c54266'; mcx.lineWidth = 3; mcx.beginPath(); mcx.arc(0, 0, hs * 1.15, 0, 7); mcx.stroke();
  var nb = null; for (k = 0; k < ms.beats.length; k++) if (ms.beats[k] >= now - 60) { nb = ms.beats[k]; break; }
  if (nb && !ms.done) { var kk = Math.max(0, Math.min(1.2, (nb - now) / MINI.period)); var rr = hs * 1.15 + kk * W * 0.22; mcx.strokeStyle = 'rgba(255,223,126,' + Math.max(0.15, 1 - kk * 0.7) + ')'; mcx.lineWidth = 6; mcx.shadowColor = '#f5c542'; mcx.shadowBlur = 14; mcx.beginPath(); mcx.arc(0, 0, rr, 0, 7); mcx.stroke(); mcx.shadowBlur = 0; }
  var sc = 1 + pulse * 0.28; mcx.save(); mcx.scale(sc, sc); mcx.translate(0, hs * 0.25);
  var col = ms.kind === 'sting' ? '#ff3b5c' : '#ffb02e'; mcx.shadowColor = col; mcx.shadowBlur = 20 + pulse * 30;
  heartPath(mcx, hs); var g = mcx.createRadialGradient(-hs * 0.2, -hs * 0.4, 2, 0, 0, hs * 1.1); g.addColorStop(0, '#fff2c0'); g.addColorStop(0.35, col); g.addColorStop(1, '#3a0008'); mcx.fillStyle = g; mcx.fill();
  mcx.restore();
  if (ms.kind === 'eye') drawEye(mcx, 0, -W * 0.3, W * 0.06, '#ffdf7e'); else drawSting(mcx, 0, -W * 0.3, W * 0.06, '#ff6f88');
  if (ms.done) { mcx.font = '900 ' + (W * 0.12) + 'px system-ui,sans-serif'; mcx.textAlign = 'center'; mcx.textBaseline = 'middle'; mcx.fillStyle = ms.ok ? '#47f59a' : '#ff5c78'; mcx.fillText(ms.ok ? '✓' : '✗', 0, W * 0.3); }
  mcx.restore();
}
function miniLoop() {
  var ms = miniSt; if (!ms) return; var now = performance.now(); drawMini(now);
  while (ms.beatIdx < ms.beats.length && now >= ms.beats[ms.beatIdx]) { ms.beatIdx++; if (!ms.done) { sfx('beat'); vib('beat'); } }
  if (!ms.done && now > ms.beats[ms.beats.length - 1] + MINI.win + 40) miniJudge(now, true);
  requestAnimationFrame(miniLoop);
}
function miniJudge(now, timeout) {
  var ms = miniSt; if (!ms || ms.done) return;
  if (!timeout && now < ms.beats[0] - MINI.period * 0.6) return; // ignore taps before the rhythm starts
  var near = 1e9; ms.beats.forEach(function (b) { var d = now - b; if (Math.abs(d) < Math.abs(near)) near = d; });
  var ok = !timeout && Math.abs(near) <= MINI.win;
  if (ms.forced != null) ok = ms.forced;
  ms.done = true; ms.ok = ok; ms.delta = Math.round(near);
  $('miniMsg').textContent = ok ? t('perfect') : (timeout ? t('late') : (near < 0 ? t('early') : t('late')));
  $('miniMsg').style.color = ok ? '#47f59a' : '#ff5c78';
  sfx(ok ? 'good' : 'bad'); vib(ok ? 'good' : 'bad');
  if (DEBUG) window.__lastMini = { ok: ok, delta: ms.delta, kind: ms.kind };
  setTimeout(function () { ms.resolve(ok); }, 900 * SPEED);
}
function runMini() {
  var m = S.mini, ai = isAI(m.p);
  $('miniTitle').textContent = m.kind === 'eye' ? t('eyeT') : t('stingT');
  $('miniTitle').style.color = m.kind === 'eye' ? '#ffdf7e' : '#ff5c78';
  $('miniTxt').textContent = m.kind === 'eye' ? t('eyeTxt') : t('stingTxt');
  $('miniMsg').textContent = ai ? t('cpuTries', { name: pname(m.p) }) : t('getReady'); $('miniMsg').style.color = '';
  $('miniTap').disabled = ai; $('miniTap').style.opacity = ai ? 0.4 : 1;
  show('mini'); renderUI(); sfx(m.kind === 'eye' ? 'eye' : 'sting'); vib(m.kind);
  var now = performance.now(), beats = []; for (var k = 0; k < MINI.beats; k++) beats.push(now + MINI.lead * SPEED + k * MINI.period);
  miniSt = { kind: m.kind, beats: beats, beatIdx: 0, done: false, forced: force.mini, resolve: null };
  force.mini = null;
  miniSt.resolve = async function (ok) {
    miniSt = null; hide('mini'); busy = true;
    var p = S.mini.p, i = S.mini.lion;
    var ev = MC.resolveMini(S, ok); save(); renderUI();
    disp = null; initDisp();
    for (var n = 0; n < ev.length; n++) {
      var e = ev[n];
      if (e.t === 'bonus') {
        var capE = ev.filter(function (x) { return x.t === 'cap'; })[0]; if (capE) disp[capE.p][capE.i] = posXY(e.to);
        banner(t('eyeWin', { n: e.to - e.from }), '', 1000); sfx('eye'); vib('eye'); await hopLion(p, i, e.from, e.to, 170);
      }
      else if (e.t === 'back') {
        banner(t('stingFail', { n: e.from - e.to }), '', 1100); sfx('sting'); vib('sting'); await hopLion(p, i, e.from, Math.max(e.to, 1), 160);
        if (e.to === 0) { var a = posXY(1), b = posXY(0); await anim(300, function (q) { disp[p][i] = { x: lerp(a.x, b.x, q), y: lerp(a.y, b.y, q) }; }); }
      }

    await handleEvents(ev.filter(function (x) { return x.t === 'cap' || x.t === 'home'; }));
    disp = null; await wait(350); busy = false; renderUI();
    if (S.phase === 'over') showWin(); else afterTurn();
  };
  if (ai) {
    var chance = S.diff === 'easy' ? 0.45 : 0.72, succ = miniSt.forced != null ? miniSt.forced : Math.random() < chance, bi = 1 + Math.floor(Math.random() * 2);
    var at = beats[bi] + (succ ? (Math.random() * 60 - 30) : (Math.random() < 0.5 ? -1 : 1) * (240 + Math.random() * 150)) - performance.now();
    var ref = miniSt; setTimeout(function () { if (miniSt === ref && !ref.done) { if (ref.forced == null) ref.forced = succ; miniJudge(performance.now()); } }, Math.max(0, at));

}
function miniTapHandler(ev) { if (ev && ev.cancelable) ev.preventDefault(); if (!miniSt || miniSt.done || !S || isAI(S.mini ? S.mini.p : S.turn)) return; miniJudge(performance.now()); }
$('miniTap').addEventListener('pointerdown', miniTapHandler);
mcv.addEventListener('pointerdown', miniTapHandler);
document.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'Enter') { if (miniSt) { e.preventDefault(); miniTapHandler(); } else if (S && S.phase === 'roll' && $('menu').hidden && document.activeElement === document.body) { e.preventDefault(); doRoll('key'); } }
});

/* ---------------- win ---------------- */
function showWin() {
  if (!S || S.winner == null) return;
  var w = S.winner;
  $('winTitle').textContent = t('winT');
  $('winTxt').innerHTML = (S.mode === 'ai' ? (w === 0 ? t('winYou') : t('winCpu')) : t('winP', { name: pname(w) })) + '<br><small style="color:var(--mut)">' + t('winStats', { t: S.rolls || S.turns, c: S.caps[w], m: S.minis[w] }) + '</small>';
  var c = $('winCv').getContext('2d'); c.clearRect(0, 0, 340, 200);
  c.save(); c.shadowColor = '#f5c542'; c.shadowBlur = 20; drawAnkh(c, 80, 110, 62, '#ffdf7e'); c.restore(); drawLion(c, 240, 100, 72, w);
  for (var k = 0; k < 40; k++) burst(G.c, G.c, k % 2 ? '#ffdf7e' : (w ? '#22e0d0' : '#ffb02e'), 1);
  show('win'); renderUI();
  if (!(S.mode === 'ai' && w === 1)) { sfx('win'); vib('win'); } else sfx('bad');
}

/* ---------------- menu ---------------- */
function drawMenuArt() {
  var c = $('menuArt').getContext('2d'), W = 300, C = 150; c.clearRect(0, 0, W, W);
  c.save(); c.shadowColor = '#f5c542'; c.shadowBlur = 12; c.strokeStyle = '#f5c542'; c.lineCap = 'round';
  var prev = null;
  for (var j = 0; j <= 260; j++) { var th = 5.2 * Math.PI * (1 - j / 260), r = 22 + th * 7.2, x = C + r * Math.cos(th - 1.57), y = C + r * Math.sin(th - 1.57); if (prev) { c.lineWidth = 3 + 9 * (j / 260); c.beginPath(); c.moveTo(prev.x, prev.y); c.lineTo(x, y); c.stroke(); } prev = { x: x, y: y }; }
  c.restore(); c.fillStyle = '#00e5c7'; c.shadowColor = '#00e5c7'; c.shadowBlur = 10; c.beginPath(); c.arc(C + 5, C - 14, 4, 0, 7); c.fill(); c.beginPath(); c.arc(C - 9, C - 17, 4, 0, 7); c.fill(); c.shadowBlur = 0;
  drawLion(c, 40, 262, 24, 0); drawLion(c, 260, 262, 24, 1);
}
function openMenu() {
  var sv = S && S.phase !== 'over' ? S : null;
  $('mContinue').hidden = !sv;
  if (sv) $('mContInfo').textContent = t('contInfo', { mode: sv.mode === '2p' ? t('mode2p') : sv.diff === 'easy' ? t('modeAIe') : t('modeAIh'), t: (sv.rolls || 0) + 1 });
  show('menu');
}
var pendingStart = null, gen = 0;
function newMatch(mode, diff) {
  clearTimeout(aiTimer); miniSt = null; hide('mini'); gen++;
  S = MC.newGame(mode, diff); S.rolls = 0; busy = false; disp = null; trail = null; drag = null; save();
  hide('menu'); hide('win'); hide('confirm'); renderUI();
  banner(t('turnOf', { name: pname(0) }), '', 1000); startTurn();
}
function askNew(mode, diff) {
  enableMotion(); ac();
  if (S && S.phase !== 'over' && (S.rolls || 0) > 0) { pendingStart = [mode, diff]; show('confirm'); return; }
  newMatch(mode, diff);
}
$('mEasy').onclick = function () { askNew('ai', 'easy'); };
$('mHard').onclick = function () { askNew('ai', 'hard'); };
$('m2p').onclick = function () { askNew('2p'); };
$('mContinue').onclick = function () { enableMotion(); ac(); hide('menu'); if (!busy && !miniSt) resumeGame(); else startTurn(); };
$('mRules').onclick = function () { show('rules'); };
$('cYes').onclick = function () { hide('confirm'); if (pendingStart) newMatch(pendingStart[0], pendingStart[1]); };
$('cNo').onclick = function () { hide('confirm'); };
$('wAgain').onclick = function () { enableMotion(); newMatch(S.mode, S.diff); };
$('wMenu').onclick = function () { hide('win'); openMenu(); };
$('menuBtn').onclick = function () { clearTimeout(aiTimer); openMenu(); };
$('rulesBtn').onclick = function () { show('rules'); };
$('rollBtn').onclick = function () { enableMotion(); ac(); doRoll('button'); };
$('langBtn').onclick = function () { prefs.lang = prefs.lang === 'pl' ? 'en' : 'pl'; savePrefs(); applyLang(); ['banner', 'hint'].forEach(function (id) { $(id).classList.remove('show'); $(id).textContent = ''; }); renderUI(); if (!$('menu').hidden) openMenu(); };
function updMute() { $('muteBtn').textContent = prefs.mute ? '🔇' : '🔊'; $('muteBtn').setAttribute('aria-pressed', prefs.mute ? 'true' : 'false'); }
$('muteBtn').onclick = function () { prefs.mute = !prefs.mute; savePrefs(); updMute(); if (!prefs.mute) { ac(); sfx('turn'); } };

/* ---------------- boot ---------------- */
applyLang(); updMute();
var rzT = 0; window.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(layout, 60); });
layout(); drawMenuArt(); requestAnimationFrame(loop);
S = loadSave();
if (S && S.phase !== 'over') { renderUI(); resumeGame(); }
else { S = null; renderUI(); openMenu(); }

if (DEBUG) {
  var dbg = document.createElement('div'); dbg.id = 'dbg'; dbg.textContent = 'debug'; if (/[?&]nobadge=1/.test(location.search)) dbg.style.display = 'none'; document.body.appendChild(dbg);
  window.MEHEN = {
    MC: MC,
    state: function () { return S ? JSON.parse(JSON.stringify(S)) : null; },
    forceRoll: function (n) { force.roll = n; }, forceMini: function (ok) { force.mini = ok; },
    speed: function (x) { SPEED = x; }, busy: function () { return busy; },
    idle: function () { return !busy && !miniSt && !drag; },
    setLions: function (arr) { S.lions = JSON.parse(JSON.stringify(arr)); save(); renderUI(); },
    setTurn: function (p) { clearTimeout(aiTimer); S.turn = p; S.phase = 'roll'; S.roll = null; save(); startTurn(); },
    move: function (lion) { var lm = MC.legalMoves(S, S.turn, S.roll); var m = lm.find(function (x) { return x.lion === lion; }) || lm.find(function (x) { return x.from === 0 && S.lions[S.turn][lion] === 0; }); return executeMove(m); },
    legal: function () { return S && S.roll && S.phase === 'move' ? MC.legalMoves(S, S.turn, S.roll) : []; },
    segXY: function (k) { var r = cv.getBoundingClientRect(), q = k >= MC.HEAD ? { x: G.c, y: G.c } : k <= 0 ? G.entry : G.segs[k]; return { x: r.left + q.x * r.width / SZ, y: r.top + q.y * r.height / SZ }; },
    nextBeat: function () { if (!miniSt) return null; var now = performance.now(); for (var i = 0; i < miniSt.beats.length; i++) if (miniSt.beats[i] > now + 40) return miniSt.beats[i] - now; return null; },
    miniOpen: function () { return !!miniSt && !miniSt.done; },

}
})();
